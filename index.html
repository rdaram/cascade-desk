:root{
  --bg:#07080a;--bg2:#0c0e11;--card:rgba(255,255,255,.032);--card2:rgba(255,255,255,.055);--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.13);
  --text:#eef0f3;--mute:#9aa1ad;--dim:#636a76;--acc:#8fa2ff;--acc-s:rgba(143,162,255,.14);--teal:#5eead4;
  --pos:#3ddc97;--pos-s:rgba(61,220,151,.12);--neg:#ff6b6b;--neg-s:rgba(255,107,107,.12);--warn:#f5c04a;--warn-s:rgba(245,192,74,.12);
  --r:18px;--r-s:12px;--sans:'Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20vh -10vw auto;height:80vh;pointer-events:none;z-index:0;
  background:radial-gradient(60% 50% at 20% 10%,rgba(143,162,255,.13),transparent 70%),radial-gradient(40% 40% at 85% 0%,rgba(94,234,212,.07),transparent 70%)}
a{color:inherit;text-decoration:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mute{color:var(--mute)}.dim{color:var(--dim)}.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px;position:relative;z-index:1}
/* nav */
nav.top{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);background:rgba(7,8,10,.72);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:22px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--acc),var(--teal),var(--acc));box-shadow:0 0 18px rgba(143,162,255,.45);display:block}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.links::-webkit-scrollbar{display:none}
.links a{padding:7px 12px;border-radius:9px;color:var(--mute);font-size:13.5px;white-space:nowrap;transition:color .2s,background .2s}
.links a:hover,.links a.on{color:var(--text);background:var(--card2)}
.stat-pill{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.live{background:var(--pos);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
/* sections */
section{padding:56px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:500;margin-bottom:10px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.03em}
h2{font-size:clamp(24px,3vw,32px);line-height:1.15}
h3{font-size:17px;letter-spacing:-.015em}
.sub{color:var(--mute);max-width:720px;margin:10px 0 0;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.048),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 60px -30px rgba(0,0,0,.7);transition:border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s}
.card.hov:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 40px 70px -30px rgba(0,0,0,.8)}
.pad{padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--mute);background:rgba(255,255,255,.03);white-space:nowrap}
.pill.live{color:var(--pos);background:var(--pos-s);border-color:rgba(61,220,151,.25)}
.pill.pend{color:var(--warn);background:var(--warn-s);border-color:rgba(245,192,74,.25)}
.pill.t1{color:var(--teal);background:rgba(94,234,212,.1);border-color:rgba(94,234,212,.3)}
.pill.closed{color:var(--text);background:rgba(255,255,255,.06)}
.pill.cxl{color:var(--dim);text-decoration:line-through}
.pill.acc{color:var(--acc);background:var(--acc-s);border-color:rgba(143,162,255,.28)}
.pill.hi{color:var(--pos);background:var(--pos-s);border-color:rgba(61,220,151,.22)}
.pill.md{color:var(--warn);background:var(--warn-s);border-color:rgba(245,192,74,.22)}
.pill.lo{color:var(--neg);background:var(--neg-s);border-color:rgba(255,107,107,.22)}
/* segmented */
.seg{display:inline-flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);gap:2px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-size:13.5px;color:var(--mute);transition:all .2s var(--ease);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.1);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.seg button:focus-visible{outline:2px solid var(--acc)}
/* hero */
.hero{padding-top:44px}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.big{font-size:clamp(44px,7vw,76px);line-height:1;font-weight:600;letter-spacing:-.045em}
.big .cents{font-size:.42em;color:var(--mute);letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13.5px;font-weight:500}
.chip.up{background:var(--pos-s);color:var(--pos)}.chip.down{background:var(--neg-s);color:var(--neg)}.chip.flat{background:rgba(255,255,255,.06);color:var(--mute)}
.lede{font-size:17px;line-height:1.6;color:#d5d9e0;margin:22px 0 0;max-width:640px}
.lede b{color:var(--text);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.mini .m{padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
.mini .m:hover{border-color:var(--line2)}
.mini .k{font-size:12px;color:var(--mute)}.mini .v{font-size:19px;font-weight:600;margin-top:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{min-width:58px;font-size:12px;color:var(--mute);padding-top:2px}
.li .what{flex:1;font-size:14px}
.kind{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--acc)}
.kind.earnings{background:var(--warn)}.kind.time_stop{background:var(--dim)}.kind.catalyst{background:var(--teal)}
/* stats */
.tile{padding:18px}
.tile .k{font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.tile .s{font-size:12.5px;color:var(--dim);margin-top:2px}
/* trade cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.track .tick.l span{left:0;transform:none}.track .tick.r span{left:auto;right:0;transform:none}
.grid.top{align-items:start}.scrolly{max-height:760px;overflow:auto;padding-right:6px;scrollbar-width:thin}
.tc{overflow:hidden}
.tc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:20px 20px 6px}
.tk{font-size:26px;font-weight:600;letter-spacing:-.035em;line-height:1}
.setup{font-size:13px;color:var(--mute);margin-top:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chart{display:block;width:100%;height:190px}
.chart .grid-l{stroke:rgba(255,255,255,.05)}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--mute)}
.draw{transition:clip-path 1.4s var(--ease);clip-path:inset(0 100% 0 0)}
.in .draw{clip-path:inset(0 0 0 0)}
.prog{padding:4px 20px 0}
.track{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,rgba(255,107,107,.35),rgba(255,255,255,.08) 40%,rgba(61,220,151,.35));margin:22px 0 26px}
.track .tick{position:absolute;top:-4px;width:2px;height:16px;background:rgba(255,255,255,.35);border-radius:2px}
.track .tick span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--mute);white-space:nowrap;font-family:var(--mono)}
.track .cur{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--text);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line2),0 0 16px rgba(255,255,255,.35);transform:translate(-50%,-50%);transition:left 1.2s var(--ease)}
.track .cur span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;font-family:var(--mono);color:var(--text);white-space:nowrap;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv div{background:#0c0d10;padding:11px 14px}
.kv .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.kv .v{font-size:14.5px;font-weight:500;margin-top:2px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;font-size:13px;background:rgba(143,162,255,.05);border-bottom:1px solid var(--line)}
.strip a{color:var(--acc)}
.drawer-btn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;padding:14px 20px;font-size:14px;font-weight:500;color:var(--text);transition:background .2s}
.drawer-btn:hover{background:rgba(255,255,255,.03)}
.drawer-btn .chev{transition:transform .3s var(--ease);color:var(--mute)}
.tc.open .chev{transform:rotate(180deg)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.tc.open .drawer{grid-template-rows:1fr}
.drawer>div{overflow:hidden}
.rs{padding:2px 20px 20px}
.rs h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);font-weight:500}
.rs p{margin:0;color:#cfd4db;font-size:14px;line-height:1.6}
.rs ul{margin:0;padding-left:18px;color:#cfd4db;font-size:14px}
.rs li{margin:3px 0}
.foot{display:flex;justify-content:space-between;gap:8px;padding:10px 20px 14px;font-size:11.5px;color:var(--dim);font-family:var(--mono);flex-wrap:wrap}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tr.flash{animation:flash 2s}
@keyframes flash{0%,40%{background:rgba(143,162,255,.18)}100%{background:transparent}}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--teal));width:0;transition:width 1.1s var(--ease)}
.in .bar i{width:var(--w)}
.empty{padding:28px;text-align:center;color:var(--mute);font-size:14px}
/* alerts / timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.ev{position:relative;padding:0 0 18px}
.ev:before{content:"";position:absolute;left:-21px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}
.ev.CLOSED:before{border-color:var(--text)}.ev.FILLED:before{border-color:var(--pos)}.ev.CANCELLED:before{border-color:var(--dim)}.ev.TARGET:before{border-color:var(--teal)}.ev.RISK_MODE:before{border-color:var(--neg)}
.ev .t{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.ev .x{font-size:13.5px;color:#d4d8de;margin-top:2px}
/* learning */
.vt{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.vstep{min-width:220px;padding:16px;border-right:1px solid var(--line)}
.vstep:last-child{border-right:0}
.layer{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.layer:last-child{border-bottom:0}
.lchip{font-family:var(--mono);font-size:12px;color:var(--acc);background:var(--acc-s);border-radius:8px;height:26px;display:flex;align-items:center;justify-content:center}
details.acc{border-top:1px solid var(--line)}
details.acc summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary .chev{transform:rotate(180deg)}
.chev{transition:transform .3s var(--ease)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gl div{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.gl b{display:block;font-size:14px;margin-bottom:4px}
.gl span{font-size:13.5px;color:var(--mute)}
footer{padding:56px 0 70px;color:var(--dim);font-size:12.5px}
/* reveal */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
body.static .reveal{opacity:1;transform:none;transition:none}
body.static .draw{clip-path:none;transition:none}
body.static .bar i{width:var(--w);transition:none}
body.static *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.draw{clip-path:none;transition:none}.bar i{width:var(--w);transition:none}*{animation:none!important;scroll-behavior:auto!important}}
/* responsive */
@media (max-width:980px){.hero-grid{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:640px){
  body{font-size:14.5px}.wrap{padding:0 16px}section{padding:40px 0 4px}
  nav.top .wrap{gap:12px;height:56px}.brand span{display:none}.stat-pill .txt{display:none}
  .g2{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.mini{grid-template-columns:1fr 1fr 1fr;gap:8px}.mini .m{padding:10px}.mini .v{font-size:15px}
  .kv{grid-template-columns:repeat(2,1fr)}.pad{padding:18px}.tc-h{padding:18px 16px 4px}.prog,.rs{padding-left:16px;padding-right:16px}.strip,.drawer-btn,.foot{padding-left:16px;padding-right:16px}
  .lede{font-size:15.5px}.tile .v{font-size:22px}.head{margin-bottom:18px}.seg button{padding:7px 11px;font-size:13px}
  th,td{padding:10px 10px}
}
</style>

const susd=(x,dp=0)=>x==null?'n/a':(x>0?'+':x<0?'-':'')+'$'+n(Math.abs(x),dp);
const pct=(x,dp=2)=>{if(x==null)return 'n/a';const r=Math.round(x*10**dp)/10**dp;return (r>0?'+':'')+n(r===0?0:r,dp)+'%'};
const cls=x=>x>0?'pos':x<0?'neg':'mute';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dshort=s=>{if(!s)return'';const m=String(s).match(/(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d:\d\d))?/);return m?`${MON[+m[2]-1]} ${+m[3]}${m[4]?', '+m[4]:''}`:s};
const daysTo=s=>{if(!s)return null;const t=new Date(s.slice(0,10)+'T12:00:00');return Math.round((t-new Date())/864e5)};
const BOOKN={main:'Main',shadow:'Shadow',mambo:'Mambo'};
const T=D.trades||[], TECH=D.technicals||{}, ACC=(D.accounts||{}).accounts||{}, FILLS=(D.accounts||{}).fills||[], RECS=(D.accounts||{}).recs||[];

function status(t){
  if(t.status==='CANCELLED')return['Cancelled','cxl'];
  if(t.status==='CLOSED')return['Closed','closed'];
  if(t.status==='OPEN')return t.t2_hit?['T2 hit','t1']:t.t1_hit?['T1 hit','t1']:['Live','live'];
  return['Pending','pend'];
}
function conf(t){const c=((t.reasoning||{}).confidence||{}).rating;return c?[c+' confidence',c==='High'?'hi':c==='Medium'?'md':'lo']:null}
function pnlOf(t){if(t.status==='CLOSED')return t.realized_pnl;if(t.status==='OPEN')return (t.unrealized_pnl||0)+(t.realized_partial||0);return null}
function spotOf(t){return t.last_spot||((TECH[t.ticker]||{}).close)||((t.indicative_latest||{}).spot)||((t.indicative||{}).spot)}
function setupName(t){
  const s=t.structure.replace(/_/g,' ');
  if(t.structure.endsWith('stock'))return `${t.structure==='long_stock'?'Long':'Short'} ${t.contracts_open??t.contracts} shares`;
  const L=t.legs, e=L[0].expiry;return `${s[0].toUpperCase()+s.slice(1)} · ${dshort(e)} ${L.map(l=>l.strike).join('/')} · x${t.contracts}`;
}

/* ---------- charts ---------- */
function candleChart(t){
  const tc=TECH[t.ticker];const lv=(t.reasoning||{}).levels||{};
  if(!tc||!tc.candles||!tc.candles.length)return `<div class="empty">Chart data unavailable</div>`;
  const C=tc.candles.slice(-72),W=640,H=230,PR=78,PT=12,PB=22;
  const ref=(t.entry&&t.entry.spot)||(t.indicative||{}).spot;
  const lv2=[lv.stop,lv.t1,lv.t2,ref].filter(x=>x!=null);
  let lo=Math.min(...C.map(c=>c[3]),...lv2),hi=Math.max(...C.map(c=>c[2]),...lv2);const padv=(hi-lo)*.06;lo-=padv;hi+=padv;
  const y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB), step=(W-PR)/C.length, bw=Math.max(2,step*.62);
  let g='';for(let i=0;i<4;i++){const yy=PT+i*(H-PT-PB)/3;g+=`<line class="grid-l" x1="0" x2="${W-PR}" y1="${yy}" y2="${yy}"/>`}
  let cs='';C.forEach((c,i)=>{const x=i*step+step/2,up=c[4]>=c[1],col=up?'#3ddc97':'#ff6b6b';
    cs+=`<line x1="${x}" x2="${x}" y1="${y(c[2])}" y2="${y(c[3])}" stroke="${col}" stroke-opacity=".55" stroke-width="1"/>`+
        `<rect x="${x-bw/2}" y="${y(Math.max(c[1],c[4]))}" width="${bw}" height="${Math.max(1,Math.abs(y(c[1])-y(c[4])))}" rx="1" fill="${col}" fill-opacity="${up?.85:.75}"/>`});
  const short=t.direction==='short';let zones='',lines='',labels='';
  if(ref!=null&&lv.stop!=null)zones+=`<rect x="0" width="${W-PR}" y="${Math.min(y(ref),y(lv.stop))}" height="${Math.abs(y(ref)-y(lv.stop))}" fill="#ff6b6b" fill-opacity=".06"/>`;
  if(ref!=null&&lv.t2!=null)zones+=`<rect x="0" width="${W-PR}" y="${Math.min(y(ref),y(lv.t2))}" height="${Math.abs(y(ref)-y(lv.t2))}" fill="#3ddc97" fill-opacity=".05"/>`;
  const L=[['Stop',lv.stop,'#ff6b6b','5 4'],['Entry',ref,'#c9ced6','2 4'],['T1',lv.t1,'#5eead4','5 4'],['T2',lv.t2,'#3ddc97','']];
  const used=[];L.forEach(([nm,v,col,da])=>{if(v==null)return;let yy=y(v);lines+=`<line x1="0" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="1.2" stroke-dasharray="${da}" stroke-opacity=".9"/>`;
    let ly=yy;used.forEach(u=>{if(Math.abs(u-ly)<15)ly=u+(ly>=u?15:-15)});used.push(ly);
    labels+=`<rect x="${W-PR+6}" y="${ly-9}" width="${PR-8}" height="18" rx="5" fill="${col}" fill-opacity=".14"/><text x="${W-PR+12}" y="${ly+4}" style="fill:${col}">${nm} ${n(v,v>=100?0:2)}</text>`});
  const last=C[C.length-1],cx=(C.length-1)*step+step/2,cy=y(spotOf(t)||last[4]);
  const mk=`<line x1="${cx}" x2="${W-PR}" y1="${cy}" y2="${cy}" stroke="#fff" stroke-opacity=".35" stroke-dasharray="1 3"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="9" fill="#fff" fill-opacity=".15"/>`;
  const axis=`<text x="2" y="${H-6}">${dshort(C[0][0])}</text><text x="${W-PR-4}" y="${H-6}" text-anchor="end">${dshort(last[0])}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(t.ticker)} daily candles with stop, entry and targets">${g}${zones}<g class="draw">${cs}</g>${lines}${mk}${labels}${axis}</svg>`;
}
function progress(t){
  const lv=(t.reasoning||{}).levels||{};if(lv.stop==null||lv.t2==null)return'';
  const ref=(t.entry&&t.entry.spot)||(t.indicative||{}).spot,cur=spotOf(t);
  const p=v=>Math.max(0,Math.min(100,(v-lv.stop)/(lv.t2-lv.stop)*100));
  return `<div class="prog"><div class="track" aria-label="price between stop and T2">
    <div class="tick l" style="left:0"><span>Stop ${n(lv.stop)}</span></div>
    ${ref!=null?`<div class="tick" style="left:${p(ref)}%"><span>${p(ref)>12&&p(ref)<88?'Entry':''}</span></div>`:''}
    ${lv.t1!=null?`<div class="tick" style="left:${p(lv.t1)}%"><span>${Math.abs(p(lv.t1)-p(ref))>10&&p(lv.t1)<88?'T1':''}</span></div>`:''}
    <div class="tick r" style="left:100%"><span>T2 ${n(lv.t2)}</span></div>
    ${cur!=null?`<div class="cur" style="left:${STATIC?p(cur):0}%" data-left="${p(cur)}"><span>${n(cur)}</span></div>`:''}
  </div></div>`;
}
function lineChart(series,{h=220,colors=['#8fa2ff','#9aa1ad'],labels=[]}={}){
  const pts=series[0].filter(v=>v!=null);if(pts.length<2)return null;
  const W=900,H=h,P=8,all=series.flat().filter(v=>v!=null);let lo=Math.min(...all),hi=Math.max(...all);if(hi-lo<1){hi+=500;lo-=500}
  const y=v=>P+(hi-v)/(hi-lo)*(H-2*P);
  let out=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${colors[0]}" stop-opacity=".28"/><stop offset="1" stop-color="${colors[0]}" stop-opacity="0"/></linearGradient></defs>`;
  for(let i=0;i<4;i++)out+=`<line x1="0" x2="${W}" y1="${P+i*(H-2*P)/3}" y2="${P+i*(H-2*P)/3}" stroke="rgba(255,255,255,.05)"/>`;
  series.forEach((s,si)=>{const m=s.length;const xy=s.map((v,i)=>v==null?null:[i/(m-1)*W,y(v)]).filter(Boolean);if(xy.length<2)return;
    const d='M'+xy.map(p=>p.map(v=>v.toFixed(1)).join(',')).join('L');
    if(si===0)out+=`<path d="${d}L${xy[xy.length-1][0]},${H}L${xy[0][0]},${H}Z" fill="url(#ga)"/>`;
    out+=`<path class="${STATIC?'':'drawline'}" d="${d}" fill="none" stroke="${colors[si]}" stroke-width="${si?1.4:2.2}" stroke-dasharray="${si?'4 4':''}" stroke-linejoin="round"/>`});
  out+=`</svg><div class="num dim" style="display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px"><span>${esc(labels[0]||'')}</span><span>${esc(labels[1]||'')}</span></div>`;
  return out;
}

   ${candleChart(t)}
   ${progress(t)}
   <div class="kv"><div><div class="k">${isS?'Entry':'Debit'}</div><div class="v num">${n(Math.abs(ind.net_debit))}</div></div><div><div class="k">Stop</div><div class="v num neg">${lv.stop!=null?n(lv.stop):'news'}</div></div><div><div class="k">T1 / T2</div><div class="v num pos">${lv.t1!=null?n(lv.t1,lv.t1>=100?0:2):'n/a'} / ${lv.t2!=null?n(lv.t2,lv.t2>=100?0:2):'n/a'}</div></div><div><div class="k">Time stop</div><div class="v num">${dshort(t.time_stop)}${days!=null&&t.status!=='CLOSED'?` <span class="dim">${days}d</span>`:''}</div></div>
     <div><div class="k">Max risk</div><div class="v num">${usd(t.max_risk_usd)}</div></div><div><div class="k">Max reward</div><div class="v num">${t.max_reward_usd?usd(t.max_reward_usd):'open'}</div></div><div><div class="k">R:R</div><div class="v num">${t.rr??'n/a'}</div></div><div><div class="k">P&L</div><div class="v num ${cls(p)}">${p==null?'n/a':susd(p)}</div></div></div>
   <div class="strip">${strip}</div>
   <button class="drawer-btn" aria-expanded="false"><span>Why this trade${r.summary?` <span class="mute" style="font-weight:400">· ${esc(((r.confidence||{}).rating)||'')} confidence</span>`:''}</span><svg class="chev" width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
   <div class="drawer"><div><div class="rs">${rs}</div></div></div>
   <div class="foot"><span>${t.id} · rec ${t.rec_id||'n/a'}</span><span>method v${t.method_version} · issued ${dshort(t.created_at)} ET</span></div>
  </article>`;
}
function tradesSec(){
  const cnt=b=>T.filter(t=>(b==='all'||t.book===b)&&t.status!=='CANCELLED').length;
  return `<section id="trades"><div class="head"><div><div class="eyebrow">Recommendations</div><h2>Every call, with its reasoning and its paper trade</h2>
   <p class="sub">Main = issued for trading. Shadow = watchlist, blocked and skipped ideas, tracked so we learn which filters help. Mambo = your own picks (<span class="num">run.py add-rec</span>).</p></div>
   <div class="seg" id="rec-seg">${['main','shadow','mambo','all'].map(b=>`<button data-recs="${b}" class="${b===state.recs?'on':''}">${b==='all'?'All':BOOKN[b]} <span class="dim num">${cnt(b)}</span></button>`).join('')}</div></div>
   <div class="cards" id="cards"></div></section>`;
}
function renderCards(){
  const b=state.recs,order={OPEN:0,PENDING:1,CLOSED:2,CANCELLED:3};
  const ts=T.filter(t=>b==='all'||t.book===b).sort((x,y)=>order[x.status]-order[y.status]||(y.max_risk_usd||0)-(x.max_risk_usd||0));
  $('#cards').innerHTML=ts.map(tradeCard).join('')||`<div class="card empty" style="grid-column:1/-1">No recommendations in this account yet.${b==='mambo'?' Log one with: python run.py add-rec TICKER --entry 12.50 --stop 11 --t1 14 --t2 16 --reason "..."':''}</div>`;
  $$('#rec-seg button').forEach(x=>x.classList.toggle('on',x.dataset.recs===b));
  observe($('#cards'));
}
function activitySec(){
  const ev=(D.alerts||[]).slice(0,16).map(a=>`<div class="ev ${a.type}"><div class="t">${dshort(a.t)} ET · ${esc(a.type.replace('_',' '))}${a.book?' · '+esc(BOOKN[a.book]||a.book):''}</div><div class="x">${esc(a.text.length>320?a.text.slice(0,320)+'…':a.text)}</div></div>`).join('');
  const pm=(D.postmortems||[]).slice(0,6).map(p=>`<div class="li"><span class="pill ${p.outcome==='win'?'live':p.outcome==='loss'?'lo':'closed'}">${esc(p.outcome)}</span><span class="what">${esc(p.why||p.one_liner)}<div class="dim num" style="font-size:11.5px">${p.trade_id} · ${p.r_multiple!=null?(p.r_multiple>0?'+':'')+n(p.r_multiple,2)+'R':''}</div></span></div>`).join('');
  return `<section id="activity"><div class="head"><div><div class="eyebrow">Activity</div><h2>Alerts and post-mortems</h2><p class="sub">The same alerts are written to out/alerts_full.md on every scan and mark, ready to send as is.</p></div></div>
   <div class="grid g2 top"><div class="card pad reveal"><h3 style="margin-bottom:16px">Latest alerts</h3><div class="tl scrolly">${ev||'<div class="empty">No alerts yet.</div>'}</div></div>
   <div class="card pad reveal" style="--d:.08s"><h3 style="margin-bottom:6px">Post-mortems</h3><p class="mute" style="font-size:13.5px;margin:0 0 6px">Written automatically when any trade closes: was the event real, direction, timing, already priced, structure vs shares, liquidity cost, kill switch.</p><div class="list">${pm||'<div class="empty">None yet. The first one is written when a trade closes.</div>'}</div></div></div></section>`;
}
function learningSec(){
  const rv=D.review||{},gates=rv.gates||[],cal=rv.calibration||{},props=rv.proposals||[];
  const vers=(D.versions||[]).map(v=>`<div class="vstep"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${v.status==='active'?'live':'closed'}">v${esc(v.version)}</span><span class="dim num" style="font-size:12px">${dshort(v.date)}</span></div><p class="mute" style="font-size:13px;margin:10px 0 0">${esc((v.changes||[]).join(' '))}</p></div>`).join('');
  const ch=(D.challengers||[]).map(c=>{const g=gates.find(x=>x.challenger===c.id)||{};
    return `<tr><td><b class="num">${esc(c.id)}</b><div class="dim" style="font-size:12px">${esc(c.tag||c.bucket||'')}</div></td><td style="min-width:260px;font-size:13px" class="mute">${esc(c.hypothesis)}</td><td><span class="pill ${c.status==='active'?'acc':c.status==='promoted'?'live':'closed'}">${esc(c.status)}</span></td><td class="num">${g.n_closed??0} / ${g.n_open??0}</td><td class="num">${g.avg_R==null?'n/a':n(g.avg_R,2)+'R'}</td><td style="font-size:12.5px;min-width:220px" class="mute">${esc(g.verdict||'')}</td></tr>`}).join('');
  const rules=(rv.rules||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const ds=rv.risk_state||{};
  return `<section id="learning"><div class="head"><div><div class="eyebrow">How the method is learning</div><h2>Champion vs challengers, with guard rails</h2>
   <p class="sub">The Main rules are the champion. Each filter has a challenger running in the Shadow account. Changes ship only on strong evidence, one at a time, with a changelog and rollback.</p></div>
   <span class="pill ${D.method.risk_mode==='NORMAL'?'live':'lo'}">Risk mode ${esc(D.method.risk_mode)}</span></div>
   <div class="grid g4" style="margin-bottom:16px">
     <div class="card tile reveal"><div class="k">Method version</div><div class="v num">v${esc(D.method.version)}</div><div class="s">${(D.versions||[]).length} version(s) logged</div></div>
     <div class="card tile reveal" style="--d:.04s"><div class="k">Main drawdown</div><div class="v num">${n(ds.main_drawdown_pct,1)}%</div><div class="s">DEFENSIVE at 5%</div></div>
     <div class="card tile reveal" style="--d:.08s"><div class="k">Loss streak</div><div class="v num">${ds.main_loss_streak??0}</div><div class="s">DEFENSIVE at 3</div></div>
     <div class="card tile reveal" style="--d:.12s"><div class="k">Proposed changes</div><div class="v num">${props.length}</div><div class="s">${esc((D.method.last_review||{}).t||'')}</div></div></div>
   <div class="card reveal" style="margin-bottom:16px"><div class="pad" style="padding-bottom:4px"><h3>Version timeline</h3></div><div class="vt">${vers}</div></div>
   <div class="card reveal" style="margin-bottom:16px"><div class="pad" style="padding-bottom:4px"><h3>Challengers and gate effectiveness</h3><div class="dim" style="font-size:12.5px">Shadow trades the gate rejected vs the Main account, by average R. Closed / open counts.</div></div>
     <div class="tbl-wrap"><table><thead><tr><th>Challenger</th><th>Hypothesis</th><th>Status</th><th>Trades</th><th>Avg R</th><th>Verdict</th></tr></thead><tbody>${ch}</tbody></table></div></div>
   <div class="grid g2">
     <div class="card pad reveal"><h3>Calibration</h3><p class="mute" style="font-size:14px">${esc(cal.verdict||'')}</p>${props.length?'<h3 style="margin-top:16px">Proposals</h3><ul class="mute">'+props.map(p=>`<li>[${esc(p.strength)}] ${esc(p.change)}</li>`).join('')+'</ul>':'<p class="dim" style="font-size:13.5px">No proposals: no bucket has enough closed trades. That is the overfitting guard working.</p>'}</div>
     <div class="card pad reveal" style="--d:.06s"><h3>Rules in force</h3><ul class="mute" style="font-size:13.5px;padding-left:18px">${rules}</ul></div></div>
   <details class="card acc reveal" style="margin-top:16px;border-top:1px solid var(--line)"><summary><h3>Changelog</h3><svg class="chev" width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></summary><pre style="white-space:pre-wrap;padding:0 20px 20px;margin:0;font:12.5px/1.6 var(--mono);color:var(--mute)">${esc(D.changelog||'')}</pre></details>
  </section>`;
}
function eventsSec(){
  const A=D.analysis||{},evs=(A.events||[]).slice().sort((a,b)=>b.cascade_score-a.cascade_score);
  const rows=evs.map(e=>`<tr><td class="num dim">${e.id}</td><td style="min-width:300px"><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.title)}</a><div class="dim" style="font-size:12px">${esc(e.location||'')} · ${esc(e.category)} · ${dshort(e.date)}${e.mainstream?' · mainstream':''}</div></td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="width:90px"><i style="--w:${e.cascade_score*10}%"></i></div><span class="num">${e.cascade_score}</span></div></td><td class="num mute">${e.time_to_pricing_days??''}d</td></tr>`).join('');
  const maps=(A.cascade_maps||[]).map(m=>{const L2=m.L2||{};const lst=a=>(a||[]).map(x=>`<b>${esc(x.ticker)}</b> <span class="mute">${esc(x.why)}</span>`).join('<br>');
    const lay=[['L0',m.L0],['L1',m.L1],['L2',`<div><span class="pos">Winners</span><br>${lst(L2.winners)}</div><div style="margin-top:8px"><span class="neg">Losers</span><br>${lst(L2.losers)}</div>`,true],['L3',m.L3],['L4',typeof m.L4==='string'?m.L4:JSON.stringify(m.L4||'')]];
    return `<details class="acc"><summary><span><span class="pill acc num">${esc(m.event_id)}</span> <b style="margin-left:6px">${esc(m.title)}</b></span><svg class="chev" width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></summary><div style="padding:0 20px 18px">${lay.map(([k,v,raw])=>v?`<div class="layer"><div class="lchip">${k}</div><div style="font-size:14px;color:#cfd4db">${raw?v:esc(v)}</div></div>`:'').join('')}${m.falsifiers?`<div class="layer"><div class="lchip" style="color:var(--neg);background:var(--neg-s)">✕</div><div class="mute" style="font-size:13.5px">${esc(Array.isArray(m.falsifiers)?m.falsifiers.join(' · '):m.falsifiers)}</div></div>`:''}</div></details>`}).join('');
  return `<section id="events"><div class="head"><div><div class="eyebrow">Event harvest · ${esc(A.scan_id||'')}</div><h2>What happened, and how far it can spread</h2><p class="sub">${esc(A.analyst_notes||'')}</p></div><span class="dim num" style="font-size:12.5px">${D.harvest.count||0} items · ${D.harvest.sources_ok}/${D.harvest.sources} feeds OK</span></div>
   <div class="card reveal" style="margin-bottom:16px"><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Event</th><th>Cascade</th><th>Priced in</th></tr></thead><tbody>${rows}</tbody></table></div></div>
   <div class="card reveal"><div class="pad" style="padding-bottom:8px"><h3>Cascade maps</h3><div class="dim" style="font-size:12.5px">L0 event → L1 direct impact → L2 exposed names → L3 non-consensus effects → L4 reflexive loop</div></div>${maps}</div></section>`;
}
function universeSec(){
  const U=D.universe||[];
  const rows=U.map(u=>`<tr><td><b>${esc(u.ticker)}</b><div class="dim" style="font-size:12px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.name||'')}</div></td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="width:110px"><i style="--w:${u.asymmetry}%"></i></div><span class="num">${n(u.asymmetry,0)}</span></div></td><td>${u.tier?`<span class="pill ${u.tier===1?'live':u.tier===2?'acc':'closed'}">Tier ${u.tier}</span>`:`<span class="pill">${esc(u.role==='reversal'?'Reversal':'None')}</span>`}</td><td class="num">${n(u.price)}</td><td class="num ${cls(u.chg_30d)}">${u.chg_30d==null?'n/a':pct(u.chg_30d*100,1)}</td><td class="num">${u.iv_hv_ratio==null?'n/a':n(u.iv_hv_ratio,2)}</td><td>${u.options_liquid?'<span class="pos">liquid</span>':'<span class="dim">thin</span>'}</td><td class="mute" style="font-size:12.5px;min-width:220px">${esc(u.catalyst_reason||'')}</td></tr>`).join('');
  return `<section id="universe"><div class="head"><div><div class="eyebrow">Universe</div><h2>Asymmetry scores</h2><p class="sub">Exposure, catalyst, how little is priced, ownership, size, optionality and tradability. Real screen data; missing data shows as n/a.</p></div></div>
   <div class="card reveal"><div class="tbl-wrap"><table><thead><tr><th>Ticker</th><th>Score</th><th>Tier</th><th>Price</th><th>30d</th><th>IV/HV</th><th>Options</th><th>Catalyst</th></tr></thead><tbody>${rows}</tbody></table></div></div></section>`;
}
function recordSec(){
  const rows=RECS.slice().reverse().map(r=>`<tr><td class="num"><b>${r.rec_id}</b>${r.supersedes?`<div class="dim" style="font-size:11.5px">revises ${r.supersedes}</div>`:''}${r.superseded_by?`<div class="warn" style="font-size:11.5px">revised by ${r.superseded_by}</div>`:''}</td><td class="num dim" style="white-space:nowrap">${dshort(r.issued_at)}</td><td><span class="pill ${r.account==='main'?'acc':''}">${BOOKN[r.account]||r.account}</span><div class="dim" style="font-size:11.5px">${esc(r.source)}</div></td><td><b>${esc(r.ticker)}</b> <span class="mute">${esc((r.setup_type||'').replace(/_/g,' '))}</span></td><td class="num">${r.stop??''} / ${r.t1??''} / ${r.t2??''}</td><td class="num"><a href="#tc-${r.trade_id}" style="color:var(--acc)">${r.trade_id||''}</a></td><td class="mute" style="font-size:13px;min-width:200px">${esc(r.paper_outcome)}</td></tr>`).join('');
  return `<section id="record"><div class="head"><div><div class="eyebrow">Track record</div><h2>Recommendations log → paper outcome</h2><p class="sub">recs.jsonl is append-only and hash-chained (python run.py verify-recs). A revision is a new linked record; the original is never edited.</p></div></div>
   <div class="card reveal"><div class="tbl-wrap" style="max-height:620px;overflow:auto"><table><thead><tr><th>Rec</th><th>Issued ET</th><th>Account</th><th>Setup</th><th>Stop / T1 / T2</th><th>Paper trade</th><th>Outcome</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No recommendations logged.</td></tr>'}</tbody></table></div></div></section>`;
}
function glossarySec(){
  return `<section id="glossary"><div class="head"><div><div class="eyebrow">Glossary</div><h2>Plain-English terms</h2></div></div><div class="gl reveal">${Object.entries(D.glossary||{}).map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div></section>`;
}
function footer(){return `<footer><div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div>Paper trading only. Not financial advice. Real quotes, conservative fills: ${esc(D.fill_policy)}</div><div class="num">Built ${esc(D.built_at)} · quotes as of ${esc(D.as_of)}</div></div></footer>`}

/* ---------- motion ---------- */
let io;
function observe(root){
  const els=$$('.reveal:not(.in)',root||document);
  if(STATIC||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));$$('.cur',root||document).forEach(c=>c.style.left=c.dataset.left+'%');return}
  io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;el.classList.add('in');$$('.cur',el).forEach(c=>setTimeout(()=>c.style.left=c.dataset.left+'%',350));io.unobserve(el)}}),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  els.forEach(e=>io.observe(e));
}
function counters(){
  $$('[data-count]').forEach(el=>{const to=+el.dataset.count;if(STATIC){return}
    const from=to*0.985,t0=performance.now(),dur=1300;const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent='$'+n(from+(to-from)*e,0);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}
function animateLines(root){
  if(STATIC)return;$$('path.drawline',root).forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=p.getAttribute('stroke-dasharray')||L;if(!p.getAttribute('stroke-dasharray')){p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition='stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1)';p.style.strokeDashoffset=0}});
}

/* ---------- boot ---------- */
$('#mkt-dot').classList.toggle('live',!!D.market_open_now);
$('#mkt-txt').textContent=(D.market_open_now?'Market open':'Market closed')+' · v'+D.method.version+' · '+dshort(D.as_of);
$('#app').innerHTML=hero()+accountSec()+tradesSec()+activitySec()+learningSec()+eventsSec()+universeSec()+recordSec()+glossarySec()+footer();
renderAccount();renderCards();observe();counters();
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-acct]');if(a&&a.closest('#acct-seg')){state.acct=a.dataset.acct;renderAccount();return}
  const r=e.target.closest('[data-recs]');if(r){state.recs=r.dataset.recs;renderCards();return}
  const g=e.target.closest('[data-goacct]');if(g){state.acct=g.dataset.goacct;state.recs=g.dataset.goacct;renderAccount();renderCards();$('#account').scrollIntoView();return}
  const f=e.target.closest('[data-fill]');if(f&&f.dataset.fill){e.preventDefault();state.acct=f.dataset.acct;renderAccount();const row=document.getElementById('fill-'+f.dataset.fill);if(row){row.scrollIntoView({block:'center'});row.classList.add('flash')}return}
  const b=e.target.closest('.drawer-btn');if(b){const c=b.closest('.tc');c.classList.toggle('open');b.setAttribute('aria-expanded',c.classList.contains('open'));}
});
if('IntersectionObserver' in window){const navio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){$$('#links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}}),{rootMargin:'-45% 0px -50% 0px'});$$('main section').forEach(s=>navio.observe(s))}
if(qs.has('open'))$$('.tc').slice(0,+qs.get('open')||1).forEach(c=>c.classList.add('open'));
window.__ok=true;
})();

</script>
</body>
